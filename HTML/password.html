<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Strength Analyzer</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .container {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        width: 300px;
    }
    h2 {
        text-align: center;
    }
    input[type="password"] {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    .strength-bar {
        height: 8px;
        border-radius: 4px;
        background: #ddd;
        margin: 5px 0;
        overflow: hidden;
    }
    .strength-fill {
        height: 100%;
        width: 0%;
        transition: width 0.3s;
    }
    .strength-text {
        font-size: 14px;
        text-align: center;
        margin-top: 5px;
    }
</style>
</head>
<body>

<div class="container">
    <h2>Password Strength</h2>
    <input type="password" id="password" placeholder="Enter password">
    <div class="strength-bar">
        <div class="strength-fill"></div>
    </div>
    <div class="strength-text">Enter a password</div>
</div>

<script>
    const passwordInput = document.getElementById('password');
    const strengthFill = document.querySelector('.strength-fill');
    const strengthText = document.querySelector('.strength-text');

    // Function to check password strength
    function checkStrength(password) {
        let score = 0;

        // Criteria checks
        if (password.length >= 8) score++;
        if (/[A-Z]/.test(password)) score++;
        if (/[a-z]/.test(password)) score++;
        if (/[0-9]/.test(password)) score++;
        if (/[^A-Za-z0-9]/.test(password)) score++;

        return score;
    }

    // Update UI based on strength
    passwordInput.addEventListener('input', () => {
        const password = passwordInput.value;
        const strength = checkStrength(password);

        let strengthColor;
        let strengthMsg;
        let width;

        switch (strength) {
            case 0:
                strengthColor = '#ddd';
                strengthMsg = 'Enter a password';
                width = '0%';
                break;
            case 1:
                strengthColor = 'red';
                strengthMsg = 'Very Weak';
                width = '20%';
                break;
            case 2:
                strengthColor = 'orange';
                strengthMsg = 'Weak';
                width = '40%';
                break;
            case 3:
                strengthColor = 'yellow';
                strengthMsg = 'Medium';
                width = '60%';
                break;
            case 4:
                strengthColor = 'blue';
                strengthMsg = 'Strong';
                width = '80%';
                break;
            case 5:
                strengthColor = 'green';
                strengthMsg = 'Very Strong';
                width = '100%';
                break;
        }

        strengthFill.style.width = width;
        strengthFill.style.background = strengthColor;
        strengthText.textContent = strengthMsg;
    });
</script>

</body>
</html>
